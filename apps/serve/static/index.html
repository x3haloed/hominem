<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified Theory Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f6f6f8; color: #222; }
    header { background: #111; color: #fff; padding: 12px 16px; }
    main { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 16px; }
    #chat { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: 80vh; display: flex; flex-direction: column; }
    #log { flex: 1; overflow-y: auto; padding: 8px; }
    .msg { margin-bottom: 10px; }
    .role { font-weight: bold; }
    #inputRow { display: flex; gap: 8px; }
    #inputRow textarea { flex: 1; resize: vertical; min-height: 48px; }
    button { padding: 8px 12px; }
    #metrics { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: 80vh; overflow-y: auto; font-size: 13px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h2>Unified Theory Chat</h2>
  </header>
  <main>
    <section id="chat">
      <div id="log"></div>
      <div style="padding-bottom: 8px;">
        <label><input type="checkbox" id="thinkingToggle"> Enable thinking mode</label>
      </div>
      <div id="inputRow">
        <textarea id="input" placeholder="Say something..."></textarea>
        <button id="send">Send</button>
      </div>
    </section>
    <section id="metrics">
      <h3>Metrics (last turn)</h3>
      <pre id="metricsPre">—</pre>
    </section>
  </main>
  <script>
    const convoId = "canonical";
    const logEl = document.getElementById("log");
    const inputEl = document.getElementById("input");
    const sendEl = document.getElementById("send");
    const metricsEl = document.getElementById("metricsPre");
    const thinkingToggle = document.getElementById("thinkingToggle");

    function append(role, content) {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<span class="role">${role}:</span> ${content}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function loadMessages() {
      const res = await fetch(`/messages?conversation_id=${encodeURIComponent(convoId)}&limit=200`);
      const data = await res.json();
      logEl.innerHTML = "";
      data.messages.forEach(m => append(m.role, m.content));
    }

    async function send() {
      const userMsg = inputEl.value.trim();
      if (!userMsg) return;
      append("user", userMsg);
      inputEl.value = "";
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          conversation_id: convoId,
          user_message: userMsg,
          enable_thinking: thinkingToggle.checked,
        })
      });
      const data = await res.json();
      append("assistant", data.assistant);
      metricsEl.textContent = JSON.stringify(data.metrics, null, 2);
    }

    sendEl.onclick = send;
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    loadMessages();
  </script>
</body>
</html>
